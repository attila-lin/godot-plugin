[package]
name = "godot-plugin"
version = "0.1.0"
authors = ["linyiyu <linyiyu1992@gmail.com>"]
edition = "2024"

[dependencies]
godot = { version = "0.4.5", optional = true }
moka = { version = "0.12.13", features = ["future"] }
open-lark = { version = "0.14", optional = true }
poem = { version = "3", features = [], optional = true }
reqwest = { version = "0.12.23", default-features = false, features = [
  "blocking",
  "gzip",
  "json",
  "rustls-tls",
], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread"] }

[features]
default = [
  "ddt",
]
ddt = ["dep:open-lark"]
gm = ["dep:poem", "dep:reqwest"]
godot = ["dep:godot"]
ui = []
